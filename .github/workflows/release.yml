name: Release

# Publishes the Glyph11 NuGet package at its csproj version.
# The push uses --skip-duplicate, so re-running only publishes a version not yet
# on NuGet.org — bump the <Version> and re-run to release it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  managed:
    name: Glyph11 (managed)
    runs-on: windows-latest
    environment:
      name: production
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0
            9.0
            10.0

      # Pack only the Glyph11 package, not the whole src solution — the solution also
      # holds the tests, the benchmark and the example, none of which ship.
      - name: Restore dependencies
        run: dotnet restore Glyph11/Glyph11.csproj
        working-directory: src

      - name: Build
        run: dotnet build Glyph11/Glyph11.csproj --configuration Release --no-restore
        working-directory: src

      - name: Pack
        run: dotnet pack Glyph11/Glyph11.csproj --configuration Release -p:ContinuousIntegrationBuild=true --no-build --output ./artifacts
        working-directory: src

      - name: List gathered packages
        run: dir artifacts
        working-directory: src

      - name: Publish packages to NuGet
        working-directory: src/artifacts
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push *.nupkg -k "$env:NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
